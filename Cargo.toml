[package]
name = "mini_claw"
version = "0.1.19"
edition = "2021"
description = "Lightweight Rust agent platform for Raspberry Pi"
license = "MIT"
repository = "https://github.com/dominic-codespoti/pinchy"
homepage = "https://github.com/dominic-codespoti/pinchy"
keywords = ["agent", "ai", "raspberry-pi", "discord", "copilot"]
categories = ["command-line-utilities"]
build = "build.rs"
include = [
    "src/**/*",
    "build.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "static/react/**/*",
]

[[bin]]
name = "pinchy"
path = "src/main.rs"

[dependencies]
# Core async runtime
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", default-features = false }
async-stream = "0.3"
async-trait = "0.1"
futures-core = "0.3"

# Web / API
axum = { version = "0.7", features = ["ws", "json"] }
tower-http = { version = "0.6", features = ["fs", "cors", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
http = "1"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# CLI
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"

# Discord
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "rustls_backend", "builder"] }

# Scheduling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
tokio-cron-scheduler = "0.15"

# Storage / persistence
rusqlite = { version = "0.38", features = ["bundled"] }
dirs = "5"

# Secrets / crypto
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
ring = "0.17"
base64 = "0.22"
subtle = "2"

# Packaging / backup
tar = "0.4"
flate2 = "1"

# Misc
anyhow = "1"
dashmap = "6"
libc = "0.2"
notify-debouncer-mini = "0.7"
once_cell = "1"
rust-embed = "8"
schemars = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
uuid = { version = "1", features = ["v4"] }

# MCP (Model Context Protocol)
rust-mcp-sdk = { version = "0.9", default-features = false, features = ["client", "stdio", "streamable-http", "reqwest"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native"] }
openssl = { version = "0.10", features = ["vendored"], optional = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[features]
default = []
vendored-openssl = ["openssl"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
