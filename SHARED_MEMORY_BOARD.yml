# ============================================================================
# CHANGE LOG (for board itself)
# ============================================================================

board_changelog:
  - date: "2026-04-02"
    change: "Wave 1 Hardening Complete: Audit log retention / cleanup policy (SM-028-hardening)"
    author: "pinchy-team"
    changes:
      - "Added audit_log_retention_days config to SharedMemoryConfig (default: 90 days)"
      - "Added cleanup_audit_log_retention() and cleanup_audit_log_older_than() to SharedMemoryStore"
      - "Added count_audit_log_entries() for diagnostics and testing"
      - "Added cleanup_shared_audit_log() and count_shared_audit_log_entries() to PinchyDb"
      - "Cleanup runs automatically during PinchyDb::migrate() with 90-day default"
      - "Zero retention_days disables cleanup (keep everything)"
      - "Cleanup is idempotent - running multiple times is safe"
      - "Added comprehensive tests: retention_respects_days, disabled_with_zero, older_than_timestamp, idempotent"
  - date: "2026-04-02"
    change: "Wave 1 Hardening Complete: FTS5 query hardening and enhanced secret detection"
    author: "pinchy-team"
    changes:
      - "Added build_safe_fts5_query() in src/memory/shared.rs and src/memory/mod.rs with comprehensive input sanitization"
      - "FTS5 hardening strips: quotes, single-quotes, asterisks, ^, -, +, ~, ., (, ), =, ; and boolean operators (AND, OR, NOT, NEAR)"
      - "Query complexity limits: max 10 words, max 64 chars per word - prevents resource exhaustion"
      - "Empty query handling: returns empty results instead of invalid MATCH ''"
      - "Fixed FTS5 prefix syntax: uses 'term*' (unquoted) instead of 'term*' (quoted) for proper prefix matching"
      - "Enhanced secret detection patterns: JWT tokens (eyJ...), SSH keys (-----BEGIN..., ssh-rsa, ssh-ed25519), Stripe keys (sk_live_, sk_test_, rk_live_, rk_test_)"
      - "Removed 'sk-' standalone pattern as too broad for documentation contexts"
      - "Added Bearer token detection (bearer: and bearer =), AWS credential patterns, connection strings"
      - "Improved high-entropy detection with contextual analysis for values after credential keywords"
      - "Added template file exceptions: .env.example, .env.sample, .env.template are allowed in docs"
      - "Added 18 new tests across shared.rs, mod.rs, and shared_memory_evil.rs"
      - "All shared memory tests pass: 39 core + 28 evil + 16 e2e = 83 tests"
      - "Risk SM-015 (Secret Leakage) status: hardened-wave-1"
      - "New risk added: FTS5 Query Injection (High) - status: hardened-wave-1"
  - date: "2026-04-02"
    change: "Wave 2: Implemented runtime enforcement for rate limits, max entries, and secret detection"
    author: "pinchy-team"
    changes:
      - "Added count_entries_by_author() method to SharedMemoryStore for max_entries_per_agent enforcement"
      - "Added count_writes_in_window() method to SharedMemoryStore for rate_limit_writes_per_hour enforcement"
      - "Added check_content_for_secrets() with MVP-safe pattern detection (password/api_key/token/private_key)"
      - "Updated save_shared_memory() in src/tools/builtins/memory.rs to enforce all runtime limits"
      - "Rate limit exceeded returns RateLimitExceeded error code with audit logging"
      - "Max entries exceeded returns MaxEntriesExceeded error code with audit logging"
      - "Secret detection returns SecretDetected error code with audit logging"
