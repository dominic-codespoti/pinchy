# Letta-Inspired Shared Memory Feature Board
# Persistent internal planning artifact for cross-agent memory system
# Manual updates expected; keep in sync with spec

# ============================================================================
# METADATA
# ============================================================================

feature_name: "Letta-Inspired Shared Memory"
spec_file: "LETTA_INSPIRED_SHARED_MEMORY_SPEC.md"
status: "wave-1-hardening-complete"
owner: "pinchy-team"
last_updated: "2026-04-02"
version: "1.0-wave-1-hardening"

# ============================================================================
# GOALS (from spec section 1.2)
# ============================================================================

goals:
  - id: G1
    priority: P0
    text: "Agents can read shared memory with explicit authorization"
    metric: "recall_memory can query shared namespaces"
    phase: MVP
    status: implemented
  - id: G2
    priority: P0
    text: "Agents can write shared memory with explicit capability"
    metric: "save_memory accepts shared namespace parameter"
    phase: MVP
    status: implemented
  - id: G3
    priority: P0
    text: "Private memory remains default and isolated"
    metric: "No regression in per-agent memory behavior"
    phase: MVP
    status: implemented
  - id: G4
    priority: P1
    text: "Shared memory counts against context/token budget"
    metric: "Integrated with existing turn-based compaction"
    phase: MVP
    status: implemented
  - id: G5
    priority: P1
    text: "Reuse existing embedding infrastructure"
    metric: "No separate embedding subsystem"
    phase: MVP
    status: implemented
  - id: G6
    priority: P2
    text: "Simple config-based access control"
    metric: "Namespace allowlists in config.yaml"
    phase: MVP
    status: implemented

# ============================================================================
# NON-GOALS (from spec section 1.3)
# ============================================================================

non_goals:
  - item: "Letta API compatibility"
    rationale: "Borrow architectural ideas, not wire protocols"
  - item: "Working/Core/Archival promotion layers"
    rationale: "Single shared pool is sufficient for MVP"
  - item: "Real-time sync across hosts"
    rationale: "Single-binary scope; clustering is v2"
  - item: "Distributed consensus"
    rationale: "SQLite is sufficient for single-host scale"
  - item: "Agent-to-agent direct messaging"
    rationale: "Use existing gateway/WebSocket patterns"
  - item: "Automatic memory merging"
    rationale: "Agents must explicitly read/write shared memory"
  - item: "Cross-organization federation"
    rationale: "Future research topic"
  - item: "Graph relationship queries"
    rationale: "Start with tag-based filtering; graph is v1.1"
  - item: "Built-in vector database"
    rationale: "SQLite + embeddings via existing providers"
  - item: "Cryptographic signatures"
    rationale: "Provenance tracking without crypto in MVP"
  - item: "Heavy secret detection"
    rationale: "Basic pattern matching enhanced in Wave 1 (JWT, SSH, API keys); ML-based deferred"

# ============================================================================
# ARCHITECTURAL DECISIONS (from spec section 8)
# These must be maintained during implementation
# ============================================================================

decisions:
  - id: D1
    date: "2026-04-01"
    title: "Config-based ACL over capabilities"
    rationale: "Simpler for single-binary deployment; sufficient for MVP scope"
    reversible_in: v1.0
  - id: D2
    date: "2026-04-01"
    title: "Single pool over Working/Core/Archival layers"
    rationale: "Reduced complexity; defer layering to v1.1+"
    reversible_in: v1.1
  - id: D3
    date: "2026-04-01"
    title: "Tool-first over HTTP-first API"
    rationale: "Consistent with Pinchy's tool-centric design patterns"
    reversible_in: v1.0
  - id: D4
    date: "2026-04-01"
    title: "Reuse ProviderManager for embeddings"
    rationale: "No new subsystem needed; follows existing fallback chain"
    reversible_in: null
  - id: D5
    date: "2026-04-01"
    title: "Shared memory counts against same context budget"
    rationale: "Preserves existing turn-based compaction behavior"
    reversible_in: null
  - id: D6
    date: "2026-04-01"
    title: "Content hashes for provenance (no Ed25519 in MVP)"
    rationale: "Basic integrity without cryptographic complexity"
    reversible_in: v1.1
  - id: D7
    date: "2026-04-01"
    title: "Explicit over Implicit sharing model"
    rationale: "No automatic sharing; all shared access requires opt-in"
    reversible_in: null
  - id: D8
    date: "2026-04-01"
    title: "Default Deny security posture"
    rationale: "Agents cannot access shared memory without explicit authorization"
    reversible_in: null

# ============================================================================
# RISKS (from spec sections 4.1, 7.3)
# ============================================================================

risks:
  - category: "Security"
    threat: "Unauthorized Read"
    severity: High
    mitigation: "Config-based ACL; default deny"
    status: implemented
  - category: "Security"
    threat: "Unauthorized Write / Poisoning"
    severity: Critical
    mitigation: "Config-based ACL + write allowlists"
    status: implemented
  - category: "Security"
    threat: "FTS5 Query Injection"
    severity: High
    mitigation: "Input sanitization: strip FTS5 operators, limit query complexity"
    status: hardened-wave-1
  - category: "Security"
    threat: "Secret Leakage"
    severity: Critical
    mitigation: "Enhanced pattern detection: JWT, SSH keys, API keys + block"
    status: hardened-wave-1
  - category: "Operational"
    threat: "Namespace flooding"
    impact: "Storage exhaustion"
    mitigation: "Rate limiting + size quotas + max_entries_per_agent (ALL ENFORCED)"
    status: implemented
  - category: "Operational"
    threat: "Shared DB corruption"
    impact: "Shared memory unavailable"
    mitigation: "Fallback to private only; backups"
    status: implemented
  - category: "Operational"
    threat: "Embedding provider down"
    impact: "Semantic search degrades"
    mitigation: "Fallback to BM25-only"
    status: implemented
  - category: "Operational"
    threat: "Config ACL misconfiguration"
    impact: "Unauthorized access possible"
    mitigation: "Validate config on startup"
    status: implemented
  - category: "Operational"
    threat: "Namespace flooding"
    impact: "Storage exhaustion"
    mitigation: "Rate limiting + size quotas"
    status: implemented

