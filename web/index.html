<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinchy Admin</title>
  </head>
  <body>
    <script>
      // Apply saved theme before Solid renders to prevent flash
      (function(){
        var t;
        try { t = localStorage.getItem("pinchy-theme"); } catch(e) {}
        var valid = ["zinc","ember","ocean","aurora","dusk","moss","slate","ruby"];
        if (t && valid.indexOf(t) !== -1) {
          document.documentElement.setAttribute("data-theme", t);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
